<!DOCTYPE html>
<html lang="en">

<head>
	<title>Psyber - Business Password</title>
	<meta charset="UTF-8">
	<meta name="format-detection" content="telephone=no">
	<!-- <meta http-equiv="Content-Security-Policy"
         content="default-src 'self' data: blob:; font-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:"> -->

	<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.min.css?_v=20260604160826">
</head>

<body>
	<div class="wrapper">
		<!-- Top Bar -->
		<header class="business-header">
			<div class="business-header__container">
				<nav class="business-header__nav">
					<a href="/" class="business-header__logo">
						<img src="img/logo.svg" alt="Logo">
					</a>
					<a href="dashboard.html" class="business-header__close">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
					</a>
				</nav>
			</div>
		</header>

		<main class="page">
			<section class="first-time default-section">
				<div class="first-time__container">

					<h1 class="first-time__title title">Create a <span>password</span></h1>

					<form class="first-time__form password-form" action="#">
						<div class="password-form__group">
							<div class="password-form__item">
								<label class="password-form__label" for="password">Password</label>
								<div class="password-form__field">
									<input class="password-form__input input" type="password" id="password" name="password" placeholder="Enter your password" required data-password-input>
									<button class="password-form__toggle" type="button" data-password-toggle>
										<svg class="password-form__icon password-form__icon--hidden" width="20" height="20">
											<use xlink:href="img/icons/icons.svg#svg-eye-off"></use>
										</svg>
										<svg class="password-form__icon password-form__icon--visible" width="20" height="20">
											<use xlink:href="img/icons/icons.svg#svg-eye"></use>
										</svg>
									</button>
								</div>
							</div>

							<div class="password-form__strength" data-password-strength>
								<div class="password-form__strength-box">
									<span class="password-form__strength-label">STRENGTH:</span>
									<span class="password-form__strength-text" data-strength-text>Moderate</span>
								</div>
								<div class="password-form__strength-bar">
									<span class="password-form__strength-segment" data-segment="1"></span>
									<span class="password-form__strength-segment" data-segment="2"></span>
									<span class="password-form__strength-segment" data-segment="3"></span>
								</div>
							</div>

							<div class="password-form__requirements">
								<p class="password-form__requirements-title">Be sure to include the following requirements:</p>
								<ul class="password-form__requirements-list">
									<li class="password-form__requirement" data-requirement="length">
										<svg class="password-form__check" width="20" height="20">
											<use xlink:href="img/icons/icons.svg#svg-check"></use>
										</svg>
										8 characters minimum
									</li>
									<li class="password-form__requirement" data-requirement="uppercase">
										<svg class="password-form__check" width="20" height="20">
											<use xlink:href="img/icons/icons.svg#svg-check"></use>
										</svg>
										an uppercase letter
									</li>
									<li class="password-form__requirement" data-requirement="number">
										<svg class="password-form__check" width="20" height="20">
											<use xlink:href="img/icons/icons.svg#svg-check"></use>
										</svg>
										a number
									</li>
									<li class="password-form__requirement" data-requirement="lowercase">
										<svg class="password-form__check" width="20" height="20">
											<use xlink:href="img/icons/icons.svg#svg-check"></use>
										</svg>
										a lowercase letter
									</li>
								</ul>
							</div>
						</div>

						<div class="password-form__item">
							<label class="password-form__label" for="confirm-password">Re-enter password</label>
							<div class="password-form__field">
								<input class="password-form__input input" type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required data-confirm-input>
								<button class="password-form__toggle" type="button" data-password-toggle>
									<svg class="password-form__icon password-form__icon--hidden" width="20" height="20">
										<use xlink:href="img/icons/icons.svg#svg-eye-off"></use>
									</svg>
									<svg class="password-form__icon password-form__icon--visible" width="20" height="20">
										<use xlink:href="img/icons/icons.svg#svg-eye"></use>
									</svg>
								</button>
							</div>
						</div>

						<button class="password-form__btn btn btn--primary" type="submit">
							NEXT
							<svg class="btn__icon" width="24" height="24">
								<use xlink:href="img/icons/icons.svg#svg-arrow"></use>
							</svg>
						</button>
					</form>
				</div>
			</section>

		</main>

		<footer class="footer">
			<div class="footer__container">
				<div class="footer__copyright">
					<img src="img/logo-icon.svg" alt="Logo" width="20" height="20">
					<p>&copy; Copyright 2025 Psyber</p>
				</div>

				<ul class="footer__list">
					<li class="footer__item">
						<a class="footer__link" href="#">
							Privacy Policy
						</a>
					</li>
					<li class="footer__item">
						<a class="footer__link" href="#">
							Terms & Conditions
						</a>
					</li>
				</ul>
			</div>
		</footer>
	</div>

	<script src="js/app.min.js?_v=20260604160826"></script>
</body>

</html>
