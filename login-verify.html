<!DOCTYPE html>
<html lang="en">

<head>
	<title>Psyber - Login</title>
	<meta charset="UTF-8">
	<meta name="format-detection" content="telephone=no">
	<!-- <meta http-equiv="Content-Security-Policy"
         content="default-src 'self' data: blob:; font-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:"> -->

	<link rel="shortcut icon" href="favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.min.css?_v=20260530193319">
</head>

<body>
	<div class="wrapper">
		<header class="header" aria-labelledby="header">
			<div class="header__container">
				<a href="/" class="header__logo">
					<img src="img/logo.svg" alt="Logo" width="162" height="41">
				</a>
				<div class="header__actions">
					<button class="header__action header__modal-trigger">
						<svg class="header__modal-icon" width="24" height="24">
							<use xlink:href="img/icons/icons.svg#svg-close"></use>
						</svg>
					</button>
				</div>
			</div>
		</header>


		<main>
			<section class="login-hero">
				<div class="login-hero__container">
					<div class="login-hero__content">
						<div class="login-hero__header">
							<h1 class="login-hero__title title">Verify your <span>email</span></h1>
							<p class="login-hero__subtitle">We sent you an email to <a class="login-hero__link login-hero__link--bold" href="#" aria-label="user@email.com">user@email.com</a> that
								contains <br />
								the pin code to sign you in.</p>
						</div>

						<form class="login-hero__form" action="#" aria-labelledby="login-hero__form">
							<!-- OTP Code -->
							<!-- 6 labels and inputs -->
							<div class="login-hero__otp">
								<label class="login-hero__label" for="otp-1" tabindex="1">
									<input class="login-hero__input input input--otp" maxlength="1" min="1" max="1" id="otp-1" name="code" type="text" required aria-label="1">
								</label>
								<label class="login-hero__label" for="otp-2" tabindex="2">
									<input class="login-hero__input input input--otp" maxlength="1" min="1" max="1" id="otp-2" name="code" type="text" required aria-label="2">
								</label>
								<label class="login-hero__label" for="otp-3" tabindex="3">
									<input class="login-hero__input input input--otp" maxlength="1" min="1" max="1" id="otp-3" name="code" type="text" required aria-label="3">
								</label>
								<label class="login-hero__label" for="otp-4" tabindex="4">
									<input class="login-hero__input input input--otp" maxlength="1" min="1" max="1" id="otp-4" name="code" type="text" required aria-label="4">
								</label>
								<label class="login-hero__label" for="otp-5" tabindex="5">
									<input class="login-hero__input input input--otp" maxlength="1" min="1" max="1" id="otp-5" name="code" type="text" required aria-label="5">
								</label>
								<label class="login-hero__label" for="otp-6" tabindex="6">
									<input class="login-hero__input input input--otp" maxlength="1" min="1" max="1" id="otp-6" name="code" type="text" required aria-label="6">
								</label>
							</div>
							<button class="login-hero__btn btn" type="submit" aria-label="Sign in with email" tabindex="7">
								continue with login code
								<svg class="login-hero__icon">
									<use xlink:href="img/icons/icons.svg#svg-arrow"></use>
								</svg>
							</button>
							<div class="login-hero__desc">
								Didn’t get your code? <a class="login-hero__link login-hero__link--langerine" href="#" aria-label="Send a new code">Send a new code</a>
							</div>
						</form>

						<a class="login-hero__back btn btn--outline" href="#">
							<svg class="login-hero__back-icon">
								<use xlink:href="img/icons/icons.svg#svg-arrow"></use>
							</svg>
							back to sign in
						</a>
					</div>
				</div>
			</section>

		</main>
		<footer class="footer">
			<div class="footer__container">
				<div class="footer__copyright">
					<img src="img/logo-icon.svg" alt="Logo" width="20" height="20">
					<p>&copy; Copyright 2025 Psyber</p>
				</div>

				<ul class="footer__list">
					<li class="footer__item">
						<a class="footer__link" href="#">
							Privacy Policy
						</a>
					</li>
					<li class="footer__item">
						<a class="footer__link" href="#">
							Terms & Conditions
						</a>
					</li>
				</ul>
			</div>
		</footer>
	</div>
	<script src="js/app.min.js?_v=20260530193319"></script>
</body>

</html>
